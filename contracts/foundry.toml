[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]
# Toolchain pinned per paper SV (F-27): Solidity 0.8.30, built with
# forge 1.3.5 (foundry-zksync fork v0.1.5).
solc_version = "0.8.30"


# Local zkSync chain configuration. Adjust the RPC URL and chain ID if using a
# different network. Port 15100 corresponds to the `master` chain defined in
# zk‑chains‑docker‑compose.yml (chain ID 271).
[profile.local]
# rpc_url = "http://localhost:3051"
chain_id = 271

[lint]
lint_on_build = false
